<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calibre Print Station</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    min-height: 100vh;
    padding: 16px;
  }

  /* ── HEADER ── */
  .header {
    background: #000;
    color: #50C878;
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  .header p  { font-size: 11px; color: #888; margin-top: 4px; }

  /* ── DEPARTMENT SELECTOR ── */
  .dept-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .dept-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid #ccc;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .dept-btn.active-ai {
    background: #000;
    color: #00AEEF;
    border-color: #00AEEF;
  }
  .dept-btn.active-pip {
    background: #000;
    color: #50C878;
    border-color: #50C878;
  }
  .dept-btn:not(.active-ai):not(.active-pip):hover {
    background: #f5f5f5;
  }

  /* ── STATUS BAR ── */
  .status {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    color: #666;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
  }
  .status-dot.connected    { background: #50C878; }
  .status-dot.disconnected { background: #e74c3c; }
  .status-dot.loading      { background: #f39c12; animation: pulse 1s infinite; }

  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }

  /* ── CONNECT BUTTON ── */
  .connect-btn {
    width: 100%;
    padding: 14px;
    background: #000;
    color: #50C878;
    border: 2px solid #50C878;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .connect-btn:active { opacity: 0.8; }
  .connect-btn.ai-theme {
    color: #00AEEF;
    border-color: #00AEEF;
  }

  /* ── JOB LIST ── */
  .jobs-header {
    font-size: 11px;
    font-weight: bold;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .job-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .job-card:active { background: #f5f5f5; }
  .job-card.selected-pip {
    border-color: #50C878;
    background: #EAF7EE;
  }
  .job-card.selected-ai {
    border-color: #00AEEF;
    background: #E3F2FD;
  }

  .job-number {
    font-size: 15px;
    font-weight: bold;
    color: #000;
    margin-bottom: 4px;
  }
  .job-number span {
    font-size: 11px;
    font-weight: normal;
    color: #888;
    margin-left: 8px;
  }
  .job-meta {
    font-size: 12px;
    color: #666;
  }
  .job-status {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #f0f0f0;
    color: #666;
    margin-top: 4px;
  }

  /* ── QR BADGE ── */
  .qr-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #EAF7EE;
    color: #1A7A40;
    margin-left: 6px;
  }
  .qr-badge.no-qr {
    background: #FFEBEE;
    color: #C00000;
  }

  /* ── COPIES SELECTOR ── */
  .copies-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .copies-label { font-size: 13px; color: #444; font-weight: bold; }
  .copies-btn {
    width: 36px; height: 36px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #f5f5f5;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .copies-count {
    font-size: 18px;
    font-weight: bold;
    min-width: 30px;
    text-align: center;
  }

  /* ── PRINT BUTTON ── */
  .print-btn {
    width: 100%;
    padding: 16px;
    background: #50C878;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .print-btn:disabled {
    background: #ccc;
    color: #888;
    cursor: not-allowed;
  }
  .print-btn.ai-theme {
    background: #00AEEF;
    color: #fff;
  }
  .print-btn:not(:disabled):active { opacity: 0.85; }

  /* ── LOG ── */
  .log {
    background: #000;
    color: #50C878;
    border-radius: 8px;
    padding: 12px;
    font-size: 11px;
    font-family: monospace;
    max-height: 160px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .log-entry { margin-bottom: 4px; }
  .log-entry.error { color: #e74c3c; }
  .log-entry.info  { color: #888; }

  /* ── LOADING ── */
  .loading-spinner {
    text-align: center;
    padding: 30px;
    color: #888;
    font-size: 13px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 30px;
    color: #888;
    font-size: 13px;
    background: #fff;
    border-radius: 8px;
    border: 1px dashed #ddd;
  }

  .refresh-btn {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    color: #666;
    margin-bottom: 16px;
  }
  .refresh-btn:active { background: #f5f5f5; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1 id="headerTitle">CALIBRE PRINT STATION</h1>
  <p id="headerSub">Select department then connect printer</p>
</div>

<!-- DEPARTMENT SELECTOR -->
<div class="dept-selector">
  <div class="dept-btn active-pip" id="btnPiping" onclick="setDept('piping')">
    🟢 PIPING DIVISION
  </div>
  <div class="dept-btn" id="btnAI" onclick="setDept('ai')">
    🔵 CALIBRE AI
  </div>
</div>

<!-- PRINTER STATUS -->
<div class="status">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Printer not connected</span>
</div>

<!-- CONNECT BUTTON -->
<button class="connect-btn" id="connectBtn" onclick="connectPrinter()">
  ⚡ CONNECT PRINTER
</button>

<!-- REFRESH -->
<button class="refresh-btn" onclick="loadJobs()">↻ Refresh jobs</button>

<!-- JOB LIST -->
<div class="jobs-header" id="jobsHeader">SELECT A JOB TO PRINT</div>
<div id="jobsList"><div class="loading-spinner">Loading jobs...</div></div>

<!-- COPIES -->
<div class="copies-row">
  <span class="copies-label">Copies:</span>
  <button class="copies-btn" onclick="changeCopies(-1)">−</button>
  <span class="copies-count" id="copiesCount">1</span>
  <button class="copies-btn" onclick="changeCopies(1)">+</button>
</div>

<!-- PRINT BUTTON -->
<button class="print-btn" id="printBtn" disabled onclick="printLabel()">
  PRINT LABEL
</button>

<!-- LOG -->
<div class="log" id="logPanel">
  <div class="log-entry info">Print station ready.</div>
</div>

<script>
// ── CONFIGURATION ─────────────────────────────────────────────────────────────
var SCRIPT_URL_PIPING = 'https://script.google.com/macros/s/AKfycbyRNsNAD4OnryXiAdY3xkODrxsKzq02Ra1Vfu_LY2fZSOPMzM-e-BK8fqdECSQo4uY/exec';
var SCRIPT_URL_AI     = 'https://script.google.com/macros/s/AKfycbxzAt8B-Lni6DPp6BrUTA-ZPBTJFuLLivMxZuLJ-wqv80NBfq2BhI6YdRlk-d-QCDyK/exec';

// ── STATE ─────────────────────────────────────────────────────────────────────
var currentDept     = 'piping';
var printer         = null;
var printerChar     = null;
var selectedJob     = null;
var copies          = 1;
var jobs            = [];

// ── DEPARTMENT SWITCH ─────────────────────────────────────────────────────────
function setDept(dept) {
  currentDept = dept;
  selectedJob = null;

  var btnPip = document.getElementById('btnPiping');
  var btnAI  = document.getElementById('btnAI');
  var conn   = document.getElementById('connectBtn');
  var print  = document.getElementById('printBtn');

  btnPip.className = 'dept-btn' + (dept === 'piping' ? ' active-pip' : '');
  btnAI.className  = 'dept-btn' + (dept === 'ai'     ? ' active-ai'  : '');

  if (dept === 'piping') {
    conn.className  = 'connect-btn';
    print.className = 'print-btn';
    document.getElementById('headerTitle').textContent = 'CALIBRE PIPE STATION';
  } else {
    conn.className  = 'connect-btn ai-theme';
    print.className = 'print-btn ai-theme';
    document.getElementById('headerTitle').textContent = 'CALIBRE AI STATION';
  }

  print.disabled = true;
  loadJobs();
}

// ── LOAD JOBS ─────────────────────────────────────────────────────────────────
function loadJobs() {
  var url = currentDept === 'piping' ? SCRIPT_URL_PIPING : SCRIPT_URL_AI;
  document.getElementById('jobsList').innerHTML =
    '<div class="loading-spinner">Loading jobs...</div>';

  fetch(url + '?action=getJobs')
    .then(function(r){ return r.json(); })
    .then(function(data){
      jobs = data.jobs || [];
      renderJobs();
    })
    .catch(function(err){
      addLog('Failed to load jobs: ' + err.message, 'error');
      document.getElementById('jobsList').innerHTML =
        '<div class="empty-state">Could not load jobs.<br>Check connection and try refreshing.</div>';
    });
}

// ── RENDER JOBS ───────────────────────────────────────────────────────────────
function renderJobs() {
  var list = document.getElementById('jobsList');
  if (!jobs || jobs.length === 0) {
    list.innerHTML = '<div class="empty-state">No jobs found.</div>';
    return;
  }

  var html = '';
  jobs.forEach(function(job, idx) {
    var hasQR   = job.qrUrl && job.qrUrl !== '';
    var selClass = selectedJob && selectedJob.jobNum === job.jobNum
      ? (currentDept === 'piping' ? ' selected-pip' : ' selected-ai')
      : '';
    var qrBadge = hasQR
      ? '<span class="qr-badge">QR ✓</span>'
      : '<span class="qr-badge no-qr">No QR</span>';
    var meta = currentDept === 'piping'
      ? (job.site || '')
      : (job.stream || job.site || '');

    html +=
      '<div class="job-card' + selClass + '" onclick="selectJob(' + idx + ')">' +
        '<div class="job-number">' + job.jobNum + qrBadge +
          '<span>' + (job.status || '') + '</span>' +
        '</div>' +
        '<div class="job-meta">' + meta + '</div>' +
      '</div>';
  });

  list.innerHTML = html;
}

// ── SELECT JOB ────────────────────────────────────────────────────────────────
function selectJob(idx) {
  selectedJob = jobs[idx];
  renderJobs();
  var printBtn = document.getElementById('printBtn');
  printBtn.disabled = !printer || !selectedJob;
  addLog('Selected: ' + selectedJob.jobNum);
}

// ── CONNECT PRINTER ───────────────────────────────────────────────────────────
function connectPrinter() {
  if (!navigator.bluetooth) {
    addLog('Bluetooth not supported on this browser.', 'error');
    return;
  }

  setStatus('loading', 'Connecting...');
  addLog('Searching for printer...');

  navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
  })
  .then(function(device) {
    addLog('Found: ' + device.name);
    return device.gatt.connect();
  })
  .then(function(server) {
    addLog('Connected to GATT server');
    return server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
  })
  .then(function(service) {
    return service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
  })
  .then(function(characteristic) {
    printerChar = characteristic;
    printer     = true;
    setStatus('connected', 'Printer connected');
    addLog('Printer ready ✓');
    if (selectedJob) {
      document.getElementById('printBtn').disabled = false;
    }
  })
  .catch(function(err) {
    setStatus('disconnected', 'Connection failed');
    addLog('Error: ' + err.message, 'error');
  });
}

// ── PRINT LABEL ───────────────────────────────────────────────────────────────
function printLabel() {
  if (!selectedJob || !printerChar) {
    addLog('No job selected or printer not connected.', 'error');
    return;
  }

  var job    = selectedJob;
  var hasQR  = job.qrUrl && job.qrUrl !== '';
  var tspl   = '';

  if (currentDept === 'piping') {
    // ── PIPING LABEL ──────────────────────────────────────────────────────
    // Header: CALIBRE PIPE
    // QR code linking to job folder
    // Job number
    // Site name
    if (hasQR) {
      tspl =
        'SIZE 40 mm,40 mm\r\n' +
        'GAP 2 mm,0\r\n' +
        'DIRECTION 0\r\n' +
        'CLS\r\n' +
        'TEXT 20,5,"3",0,1,1,"CALIBRE PIPE"\r\n' +
        'QRCODE 10,30,M,4,A,0,"' + job.qrUrl + '"\r\n' +
        'TEXT 20,195,"2",0,1,1,"' + job.jobNum + '"\r\n' +
        'TEXT 20,215,"2",0,1,1,"' + (job.site || '') + '"\r\n' +
        'PRINT ' + copies + '\r\n';
    } else {
      // No QR — print text only label
      tspl =
        'SIZE 40 mm,30 mm\r\n' +
        'GAP 2 mm,0\r\n' +
        'DIRECTION 0\r\n' +
        'CLS\r\n' +
        'TEXT 20,5,"3",0,1,1,"CALIBRE PIPE"\r\n' +
        'TEXT 20,40,"2",0,1,1,"' + job.jobNum + '"\r\n' +
        'TEXT 20,65,"2",0,1,1,"' + (job.site || '') + '"\r\n' +
        'PRINT ' + copies + '\r\n';
      addLog('Warning: No QR code for this job — printing text label only.', 'error');
    }
  } else {
    // ── CALIBRE AI LABEL ─────────────────────────────────────────────────
    // Existing Calibre AI label format preserved
    tspl =
      'SIZE 40 mm,30 mm\r\n' +
      'GAP 2 mm,0\r\n' +
      'DIRECTION 0\r\n' +
      'CLS\r\n' +
      'TEXT 100,5,"3",0,1,1,"CALIBRE AI"\r\n' +
      'QRCODE 10,30,M,4,A,0,"' + (job.qrUrl || job.folderUrl || '') + '"\r\n' +
      'TEXT 40,185,"3",0,1,1,"' + job.jobNum + '"\r\n' +
      'PRINT ' + copies + '\r\n';
  }

  addLog('Sending print job: ' + job.jobNum + ' x' + copies);

  var encoder = new TextEncoder();
  var data    = encoder.encode(tspl);

  // Split into 20-byte chunks for Bluetooth transmission
  var chunkSize = 20;
  var chunks    = [];
  for (var i = 0; i < data.length; i += chunkSize) {
    chunks.push(data.slice(i, i + chunkSize));
  }

  function sendChunk(idx) {
    if (idx >= chunks.length) {
      addLog('Print complete ✓');
      return;
    }
    printerChar.writeValue(chunks[idx])
      .then(function(){ sendChunk(idx + 1); })
      .catch(function(err){
        addLog('Print error: ' + err.message, 'error');
      });
  }

  sendChunk(0);
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function changeCopies(delta) {
  copies = Math.max(1, Math.min(10, copies + delta));
  document.getElementById('copiesCount').textContent = copies;
}

function setStatus(state, text) {
  var dot  = document.getElementById('statusDot');
  var span = document.getElementById('statusText');
  dot.className  = 'status-dot ' + state;
  span.textContent = text;
}

function addLog(msg, type) {
  var log   = document.getElementById('logPanel');
  var entry = document.createElement('div');
  entry.className = 'log-entry ' + (type || '');
  var time = new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  entry.textContent = '[' + time + '] ' + msg;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.onload = function() {
  setDept('piping');
};
</script>
</body>
</html>
